[project]
name = "pythonic-integer"
version = "0.1.0"
description = "A class representing the mathematical concept of an integer using only the Python built-ins: no 'import' allowed!"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]
test = [
  "hypothesis",
  "more-itertools",
  "pytest"
]

[tool.pytest.ini_options]
addopts = "-vv"
console_output_style = "progress"


[tool.uv]
compile-bytecode = true
required-version = ">=0.9.0"
